name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install nightly toolchain
        run: rustup install nightly

      - name: Add rustfmt for nightly
        run: rustup component add rustfmt --toolchain nightly

      - name: Check
        run: cargo +nightly fmt --all --check -- --config format_code_in_doc_comments=true

  check:
    name: Check crate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.1

      - name: Check
        run: cargo check

      - name: Check wasm32 target
        run: cargo check --target wasm32-unknown-unknown

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test

      - name: Build host FFI and binding generator
        run: cargo build --lib --bin uniffi-bindgen

      - name: Upload host FFI
        uses: actions/upload-artifact@v7
        with:
          name: nostr-sdk-ffi-ci-linux
          path: |
            target/debug/libnostr_sdk_ffi.so
            target/debug/uniffi-bindgen
          retention-days: 1

  bindings:
    name: Binding examples and documentation
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          key: binding-generators

      - name: Download host FFI
        uses: actions/download-artifact@v8
        with:
          name: nostr-sdk-ffi-ci-linux
          path: target/debug

      - name: Restore binding generator executable permission
        run: chmod +x target/debug/uniffi-bindgen

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: python/requirements-dev.txt

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: js
        run: npm ci

      - name: Install external binding generators
        run: |
          cargo install uniffi-bindgen-cs --git https://github.com/nostrdevkit/uniffi-bindgen-cs --branch trait-impls
          cargo install gobley-uniffi-bindgen --git https://github.com/nostrdevkit/gobley --rev f5069745b497e00f26f4e7d6752412cd007ad7f2

      - name: Check Python examples
        env:
          MYPYPATH: python/src/nostr-sdk
          PYTHONPATH: python/src/nostr-sdk
        run: |
          python -m pip install -r python/requirements-dev.txt
          target/debug/uniffi-bindgen generate --library target/debug/libnostr_sdk_ffi.so --language python --no-format -o target/uniffi/python
          cp target/uniffi/python/nostr_sdk.py python/src/nostr-sdk/
          cp target/debug/libnostr_sdk_ffi.so python/src/nostr-sdk/
          python -m mypy --config-file python/mypy.ini python/examples
          python -m compileall -q python/examples
          find python/examples -type f -name '*.py' -print0 | sort -z | while IFS= read -r -d '' example; do
            echo "Importing $example"
            python -c 'import runpy, sys; runpy.run_path(sys.argv[1], run_name="__example_check__")' "$example"
          done

      - name: Check JVM examples and documentation
        run: |
          target/debug/uniffi-bindgen generate --library target/debug/libnostr_sdk_ffi.so --language kotlin --no-format -o target/uniffi/jvm-kotlin
          mkdir -p jvm/lib/src/main/kotlin jvm/lib/src/main/resources/linux-x86-64
          cp -R target/uniffi/jvm-kotlin/. jvm/lib/src/main/kotlin/
          cp target/debug/libnostr_sdk_ffi.so jvm/lib/src/main/resources/linux-x86-64/
          cd jvm
          ./gradlew test dokkaJavadocJar

      - name: Check Android example and documentation
        run: |
          target/debug/uniffi-bindgen generate --library target/debug/libnostr_sdk_ffi.so --config uniffi-android.toml --language kotlin --no-format -o target/uniffi/android-kotlin
          mkdir -p android/lib/src/main/kotlin
          cp -R target/uniffi/android-kotlin/. android/lib/src/main/kotlin/
          cd android
          ./gradlew :lib:compileDebugUnitTestKotlin :lib:dokkaJavadocJar

      - name: Check Kotlin Multiplatform example and documentation
        run: |
          gobley-uniffi-bindgen --library target/debug/libnostr_sdk_ffi.so --config uniffi-kmp.toml -o target/uniffi/kotlin-multiplatform
          cp -R target/uniffi/kotlin-multiplatform/. kmp/nostr-sdk-kmp/src/
          mkdir -p kmp/nostr-sdk-kmp/src/jvmMain/resources/linux-x86-64
          cp target/debug/libnostr_sdk_ffi.so kmp/nostr-sdk-kmp/src/jvmMain/resources/linux-x86-64/
          cd kmp
          ./gradlew :nostr-sdk-kmp:compileTestKotlinJvm :nostr-sdk-kmp:kotlinMultiplatformDokkaJavadocJar

      - name: Check C# examples and IDE documentation
        run: |
          uniffi-bindgen-cs --library target/debug/libnostr_sdk_ffi.so -o target/uniffi/csharp
          cp target/uniffi/csharp/nostr_sdk.cs csharp/Nostr.Sdk/
          find csharp/Examples -type f -name '*.csproj' -print0 | sort -z | while IFS= read -r -d '' example; do
            dotnet build "$example"
          done
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/debug" dotnet run --project csharp/Examples/Keys/Keys.csproj --no-build
          test -s csharp/Nostr.Sdk/bin/Debug/net6.0/Nostr.Sdk.xml
          python -c 'import xml.etree.ElementTree as ET; ET.parse("csharp/Nostr.Sdk/bin/Debug/net6.0/Nostr.Sdk.xml")'

      - name: Patch JavaScript binding generator
        run: node js/scripts/patch-ubrn.mjs

      - name: Check Node.js example
        working-directory: js/node
        env:
          NOSTR_SDK_FFI_LIBRARY: ${{ github.workspace }}/target/debug/libnostr_sdk_ffi.so
        run: |
          npm run clean
          npm run generate
          npm run compile
          node scripts/package-native.mjs linux-x64-gnu ../../target/debug/libnostr_sdk_ffi.so
          mkdir -p node_modules/@nostrdevkit
          ln -s "$GITHUB_WORKSPACE/js/node/platforms/linux-x64-gnu" node_modules/@nostrdevkit/nostr-sdk-node-linux-x64-gnu
          npm test

      - name: Check React Native example
        working-directory: js/react-native
        env:
          NOSTR_SDK_FFI_LIBRARY: ${{ github.workspace }}/target/debug/libnostr_sdk_ffi.so
        run: |
          npm run clean
          npm run generate
          npm run check:examples

  web:
    name: Web example
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          key: web-examples

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked

      - name: Install JavaScript dependencies
        working-directory: js
        run: npm ci

      - name: Build and run Web example
        working-directory: js/web
        run: |
          npm run build
          npm test

  swift:
    name: Swift example
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          key: swift-examples

      - name: Build host FFI and binding generator
        run: cargo build --lib --bin uniffi-bindgen

      - name: Generate Swift binding
        run: target/debug/uniffi-bindgen generate --library target/debug/libnostr_sdk_ffi.dylib --language swift --no-format -o target/uniffi/swift

      - name: Assemble host Swift package
        working-directory: swift
        env:
          HOST_ONLY: 1
        run: bash assemble.sh

      - name: Check Swift tests and example
        working-directory: swift
        run: |
          swift test
          swift run NostrSDKExample
